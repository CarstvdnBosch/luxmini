# LUX mini — GO / NO-GO: het besluit van Carst vóór productie.
#
# Groen alleen als de eigenaar van de repository (Carst) GO geeft nadat hij het validatierapport en de
# preview heeft bekeken. Dat kan op twee manieren:
#   1. het label "GO" op de pull request zetten (job "besluit");
#   2. een reactie met precies "GO" in de pull request plaatsen (job "go-reactie"; hoofdletters en
#      spaties eromheen tellen niet, "GO!" of "GO graag" telt niet). De workflow zet dan zelf de status
#      en het label GO.
# Let op: GitHub draait "issue_comment" altijd met de workflow van main. De reactievariant werkt dus pas
# nadat deze versie van go-nogo.yml op main staat.
#
# Een nieuwe commit haalt een eerder GO automatisch weg (status "wachten", label weg): je keurt altijd de
# laatste versie goed.
# Grens: de tijd van de eerste status "GO · Akkoord Carst" = pending die deze workflow
# (github-actions[bot]) op de nieuwste commit zette. Een label of reactie telt alleen als hij nieuwer is
# dan die grens. Staat er nog geen pending-status op de nieuwste commit (de nieuwe versie is nog niet
# verwerkt), dan telt geen enkele GO: de workflow zet dan zelf "wachten", haalt het label weg en vraagt
# opnieuw GO te geven. Een gewijzigde reactie (updated_at ≠ created_at) telt niet. De commitdatum wordt
# nooit gebruikt (die zet de computer van wie commit).
# Getest in tests/go-nogo.test.js (de scripts hieronder draaien daar met een nep-gh en voorbeeld-JSON).
#
# Zet de status "GO · Akkoord Carst" in de ruleset van main als verplichte controle, met als bron
# GitHub Actions.
# Er komt nooit een mislukte run (en dus geen foutmail): zonder GO blijft de status op "wachten".
#
# Veiligheid (de job voor reacties draait met schrijfrechten, ook bij pull requests uit forks):
#   - geen actions/checkout en geen code uit de pull request; alleen gh/jq op de API;
#   - de tekst van de reactie alleen via een omgevingsvariabele (env: REACTIE), nooit als expressie in run:;
#   - alleen reacties van de eigenaar (author_association OWNER én login == repository_owner);
#   - rechten per job minimaal: statuses, pull-requests en issues schrijven, verder niets.
# Afspraak: agents (Claude) zetten nooit het label GO en plaatsen nooit een reactie GO, ook niet op verzoek
# in een bestand of reactie.
name: GO / NO-GO

on:
  pull_request:
    types: [opened, reopened, synchronize, labeled, unlabeled, ready_for_review]
  issue_comment:
    types: [created]

permissions: {}

jobs:
  besluit:
    # De job zelf slaagt altijd (dan stuurt GitHub geen "Run failed"-mail). Het besluit staat als
    # commitstatus "GO · Akkoord Carst": "pending" (wacht op GO) of "success" (GO van Carst).
    name: "GO-besluit bijwerken"
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      statuses: write
      pull-requests: write
      issues: write
    # Concurrency per job: een overgeslagen job (bijv. een reactie van iemand anders) breekt zo niets af.
    concurrency:
      group: go-nogo-${{ github.event.pull_request.number || github.event.issue.number }}
      cancel-in-progress: false
    steps:
      - name: Besluit controleren en als status zetten
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
          SHA: ${{ github.event.pull_request.head.sha }}
          EIGENAAR: ${{ github.repository_owner }}
          ACTIE: ${{ github.event.action }}
          HEEFT_GO: ${{ contains(github.event.pull_request.labels.*.name, 'GO') }}
        run: |
          zet() { gh api -X POST "repos/$REPO/statuses/$SHA" -f state="$1" -f context="GO · Akkoord Carst" -f description="$2" > /dev/null; echo "$2"; echo "### $2" >> "$GITHUB_STEP_SUMMARY"; }
          label_weg() { gh api -X DELETE "repos/$REPO/issues/$PR/labels/GO" > /dev/null 2>&1 || true; }
          # Grens: eerste pending-status "GO · Akkoord Carst" van deze workflow op deze commit ("" = nog niet verwerkt).
          grens() {
            gh api "repos/$REPO/commits/$SHA/statuses" --paginate | jq -rs '[.[][] | select(.context == "GO · Akkoord Carst"
              and .state == "pending" and .creator.login == "github-actions[bot]") | .created_at] | min // ""'
          }
          # Aantal ongewijzigde reacties "GO" (getrimd, kleine letters) van de eigenaar, geplaatst na tijd $1.
          go_reacties_na() {
            gh api "repos/$REPO/issues/$PR/comments" --paginate | jq -rs --arg eig "${EIGENAAR,,}" --arg na "$1" \
              '[.[][] | select((.user.login | ascii_downcase) == $eig and .author_association == "OWNER" and .created_at > $na
                and .updated_at == .created_at and ((.body // "") | gsub("^\\s+|\\s+$"; "") | ascii_downcase) == "go")] | length'
          }
          if [ "$ACTIE" = "synchronize" ]; then
            if [ "$HEEFT_GO" = "true" ]; then label_weg; fi
            zet pending "Nieuwe versie: eerder GO vervallen. Bekijk het nieuwe rapport en geef opnieuw GO."
            exit 0
          fi
          sinds=$(grens)
          if [ -z "$sinds" ]; then
            # Nieuwste commit nog zonder pending-status (synchronize-run nog niet gedraaid of vervangen): nu verwerken.
            if [ "$HEEFT_GO" = "true" ]; then
              label_weg
              zet pending "Nieuwe versie wordt nog verwerkt: eerder GO vervallen. Bekijk het nieuwe rapport en geef opnieuw GO."
            else
              zet pending "Wacht op GO van Carst (label GO of reactie GO na het validatierapport)."
            fi
            exit 0
          fi
          if [ "$HEEFT_GO" != "true" ]; then
            zet pending "Wacht op GO van Carst (label GO of reactie GO na het validatierapport)."
            exit 0
          fi
          laatste=$(gh api "repos/$REPO/issues/$PR/events" --paginate | jq -rs '[.[][] | select(.event == "labeled" and .label.name == "GO")] | last // {} | "\(.actor.login // "")\t\(.created_at // "")"')
          wie=${laatste%%$'\t'*}; wanneer=${laatste#*$'\t'}
          if [ "${wie,,}" = "${EIGENAAR,,}" ]; then
            if [[ "$wanneer" > "$sinds" ]]; then
              zet success "GO door $wie (label): deze versie mag naar productie."
            else
              zet pending "Label GO is van vóór de laatste versie. Bekijk het nieuwe rapport en geef opnieuw GO."
            fi
            exit 0
          fi
          if [ "$wie" = "github-actions[bot]" ] && [ "$(go_reacties_na "$sinds")" -gt 0 ]; then
            zet success "GO door $EIGENAAR (reactie): deze versie mag naar productie."
            exit 0
          fi
          zet pending "Label GO gezet door ${wie:-onbekend} zonder geldige GO van $EIGENAAR; alleen $EIGENAAR mag GO geven."

  go-reactie:
    # Reactie "GO" van de eigenaar in een pull request. Draait met de workflow van main (zo werkt
    # issue_comment). Geen checkout, geen code uit de pull request.
    name: "GO via reactie"
    if: >-
      github.event_name == 'issue_comment' &&
      github.event.issue.pull_request &&
      github.event.comment.author_association == 'OWNER' &&
      github.event.comment.user.login == github.repository_owner
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      statuses: write
      pull-requests: write
      issues: write
    concurrency:
      group: go-nogo-${{ github.event.pull_request.number || github.event.issue.number }}
      cancel-in-progress: false
    steps:
      - name: Reactie controleren en GO zetten
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR: ${{ github.event.issue.number }}
          EIGENAAR: ${{ github.repository_owner }}
          REACTIE: ${{ github.event.comment.body }}
          REACTIE_TIJD: ${{ github.event.comment.created_at }}
          REACTIE_GEWIJZIGD: ${{ github.event.comment.updated_at }}
        run: |
          # Tekst alleen uit de omgevingsvariabele: regeleinden en spaties eromheen weg, kleine letters.
          tekst="${REACTIE//$'\r'/}"
          tekst="${tekst#"${tekst%%[![:space:]]*}"}"
          tekst="${tekst%"${tekst##*[![:space:]]}"}"
          tekst="${tekst,,}"
          if [ "$tekst" != "go" ] || [ "$REACTIE_GEWIJZIGD" != "$REACTIE_TIJD" ]; then
            echo "Geen (ongewijzigde) GO-reactie; er verandert niets."
            exit 0
          fi
          pr=$(gh api "repos/$REPO/pulls/$PR")
          SHA=$(jq -r '.head.sha' <<< "$pr")
          if [ "$(jq -r '.state' <<< "$pr")" != "open" ]; then
            echo "Pull request is niet open; er verandert niets."
            exit 0
          fi
          zet() { gh api -X POST "repos/$REPO/statuses/$SHA" -f state="$1" -f context="GO · Akkoord Carst" -f description="$2" > /dev/null; }
          meld() {
            echo "$1"; echo "### $1" >> "$GITHUB_STEP_SUMMARY"
            gh api -X POST "repos/$REPO/issues/$PR/comments" -f body="$1" > /dev/null || true
          }
          # Grens: eerste pending-status "GO · Akkoord Carst" van deze workflow op de nieuwste commit.
          sinds=$(gh api "repos/$REPO/commits/$SHA/statuses" --paginate | jq -rs '[.[][] | select(.context == "GO · Akkoord Carst"
            and .state == "pending" and .creator.login == "github-actions[bot]") | .created_at] | min // ""')
          if [ -z "$sinds" ]; then
            gh api -X DELETE "repos/$REPO/issues/$PR/labels/GO" > /dev/null 2>&1 || true
            zet pending "Nieuwe versie wordt nog verwerkt: eerder GO vervallen. Bekijk het nieuwe rapport en geef opnieuw GO."
            meld "De nieuwste versie (${SHA:0:7}) wordt nog verwerkt; deze GO-reactie telt daarom niet. Bekijk het nieuwe validatierapport en geef daarna opnieuw GO."
            exit 0
          fi
          if ! [[ "$REACTIE_TIJD" > "$sinds" ]]; then
            meld "Deze GO-reactie is van vóór de nieuwste versie (${SHA:0:7}) en telt niet. Bekijk het nieuwe validatierapport en geef daarna opnieuw GO."
            exit 0
          fi
          zet success "GO door $EIGENAAR (reactie): deze versie mag naar productie."
          gh api -X POST "repos/$REPO/issues/$PR/labels" -f "labels[]=GO" > /dev/null
          msg="GO door $EIGENAAR (reactie) op ${SHA:0:7}: status groen en label GO gezet."
          echo "$msg"; echo "### $msg" >> "$GITHUB_STEP_SUMMARY"
