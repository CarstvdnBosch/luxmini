# LUX mini — Gate 3 · rooktest op de live site
# Draait na elke merge naar main (Cloudflare zet dan live) en elke ochtend.
# Adres van de live site: variabele SITE_URL (GitHub → Settings → Secrets and variables → Actions → Variables);
# zonder variabele gebruikt de rooktest https://luxmini.carstvdbosch.workers.dev.
#   (eerst https://luxmini.<jouw-subdomein>.workers.dev, na de overstap https://www.luxmini.nl)
name: Rooktest live

on:
  push:
    branches: [main]
  schedule:
    - cron: "17 6 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  rooktest:
    name: "Gate 3 · Rooktest live"
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Wachten tot Cloudflare deze versie live heeft gezet
        if: github.event_name == 'push'
        run: |
          # Workers Builds schrijft de commit in /versie.txt (build command in de README).
          for i in $(seq 1 40); do
            live=$(curl -s "${{ vars.SITE_URL || 'https://luxmini.carstvdbosch.workers.dev' }}/versie.txt" | tr -d '[:space:]')
            if [ "$live" = "${{ github.sha }}" ]; then echo "Versie ${{ github.sha }} staat live."; exit 0; fi
            sleep 15
          done
          if [ -z "$live" ] || echo "$live" | grep -q '<'; then
            echo "::warning::/versie.txt geeft geen commit terug (build command nog niet ingesteld?). Rooktest test de huidige live versie."
            exit 0
          fi
          echo "::error::Na 10 minuten staat versie ${{ github.sha }} nog niet live (live: $live). Kijk in Cloudflare → Workers & Pages → luxmini → Deployments of de build gelukt is."
          exit 1
      - run: bash scripts/rooktest.sh "${{ vars.SITE_URL || 'https://luxmini.carstvdbosch.workers.dev' }}"
