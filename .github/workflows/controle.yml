# LUX mini — automatische controle bij elke pull request (onderdeel van de AI-PDLC, zie docs/ai-pdlc.md)
#
#   Gate 1 · tests        formulierlogica + Cloudflare-configuratie (dry-run, zet niets live)
#   Gate 2 · sitecontrole links, foto's, alt-teksten, mobiel, JavaScript-fouten en interacties
#   Gate 4 · kwaliteit    toegankelijkheid (axe, WCAG 2.1 AA), SEO, beveiligingsheaders, kernpaden (Playwright Test)
#                         en snelheid (Lighthouse CI): blokkerend
#   Gate 5 · visueel      schermvergelijking met de goedgekeurde basis: alleen waarschuwing
#   Validatierapport      bundelt alles voor het GO / NO-GO-besluit van Carst (reactie in de pull request)
#   (Gate 3 is de rooktest na live zetten: rooktest.yml. Het besluit zelf: go-nogo.yml.)
#
# Live zetten doet Cloudflare Workers Builds zelf na een merge naar main.
# In GitHub staan deze twee gates als "verplichte controles" op main: zonder groen kan er niet gemerged worden.
name: Controle

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: controle-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    name: "Gate 1 · Tests"
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci || npm install
      - run: npm test
      - name: Cloudflare-configuratie controleren (dry-run)
        run: npx wrangler deploy --dry-run --outdir dist

  sitecontrole:
    name: "Gate 2 · Sitecontrole"
    runs-on: ubuntu-latest
    timeout-minutes: 20
    container: mcr.microsoft.com/playwright/python:v1.47.0-jammy
    steps:
      - uses: actions/checkout@v4
      - name: Playwright voor Python (zelfde versie als de browsers in de container)
        run: pip install --no-cache-dir playwright==1.47.0 pillow
      - run: python3 scripts/controleer.py
      - name: Screenshots bewaren
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: screenshots
          path: scripts/screenshots/
          retention-days: 14

  kwaliteit:
    name: "Gate 4 · Kwaliteit"
    runs-on: ubuntu-latest
    timeout-minutes: 45  # browserinstallatie max. 18 min (2 × 8) + tests + Lighthouse met mogelijke TBT-herkansing
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci || npm install
      # Browsers uit de cache (sleutel: besturingssysteem + Playwright-versie uit node_modules, niet hard
      # in de workflow). Systeempakketten staan niet in de cache: bij een treffer alleen install-deps.
      - name: Playwright-versie bepalen
        id: pw
        run: echo "versie=$(npx playwright --version | awk '{print $2}')" >> "$GITHUB_OUTPUT"
      - name: Browsers uit de cache halen
        id: pw-cache
        uses: actions/cache/restore@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.pw.outputs.versie }}-chromium-webkit
      - name: Browsers installeren (Chromium en WebKit)
        id: browsers
        # twee pogingen van hooguit 8 minuten (besluit 7 nov.); hangt de eerste, dan stopt timeout hem
        timeout-minutes: 18
        env:
          CACHE_HIT: ${{ steps.pw-cache.outputs.cache-hit }}
        run: |
          if [ "$CACHE_HIT" = "true" ]; then
            echo "Browsers uit de cache; alleen systeempakketten installeren."
            installeer() { npx playwright install-deps chromium webkit; }
          else
            installeer() { npx playwright install --with-deps chromium webkit; }
          fi
          export -f installeer
          timeout -k 30 480 bash -c installeer || {
            echo "::warning::Browserinstallatie mislukt of duurde langer dan 8 minuten; tweede en laatste poging."
            timeout -k 30 480 bash -c installeer
          }
      - name: Browsers in de cache bewaren
        if: steps.pw-cache.outputs.cache-hit != 'true' && steps.browsers.outcome == 'success'
        uses: actions/cache/save@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.pw.outputs.versie }}-chromium-webkit
      - name: Toegankelijkheid, SEO, veiligheid en kernpaden (Playwright Test)
        id: e2e
        run: npx playwright test
      - name: Snelheid en kwaliteit per pagina (Lighthouse CI)
        id: lighthouse
        if: always()
        # Eén herkansing, alleen voor total-blocking-time (TBT): die meting wisselt op de GitHub-runner.
        # Faalt de toets en staat in .lighthouseci/assertion-results.json als fout (level "error")
        # uitsluitend auditId "total-blocking-time", dan wordt de eerste meting bewaard in
        # rapport/lighthouse-poging-1/ en meet lhci autorun precies één keer opnieuw (weer 3 runs,
        # median-run, zelfde grenzen uit lighthouserc.cjs); de tweede uitslag telt. Bij elke andere fout
        # (prestatiescore, LCP, CLS, toegankelijkheid, SEO, gewicht …) of als er geen uitslag is: geen herkansing.
        run: |
          set +e
          npx lhci autorun; status=$?
          if [ "$status" -ne 0 ] && [ -f .lighthouseci/assertion-results.json ] && jq -e \
               '[.[] | select(.level == "error" and (.passed | not))] as $f | ($f | length) > 0 and ($f | all(.auditId == "total-blocking-time"))' \
               .lighthouseci/assertion-results.json > /dev/null; then
            echo "::warning::Lighthouse faalde alleen op total-blocking-time; precies één herkansing (de tweede uitslag telt)."
            echo "### Lighthouse: alleen TBT te hoog, één herkansing gedaan (eerste meting in rapport/lighthouse-poging-1/)" >> "$GITHUB_STEP_SUMMARY"
            mkdir -p rapport/lighthouse-poging-1
            cp -r .lighthouseci rapport/lighthouse-poging-1/lighthouseci
            if [ -d rapport/lighthouse ]; then mv rapport/lighthouse rapport/lighthouse-poging-1/lighthouse; fi
            rm -rf .lighthouseci
            npx lhci autorun; status=$?
          fi
          exit "$status"
      - name: Resultaten bewaren
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kwaliteit
          path: |
            rapport/
            .lighthouseci/
          include-hidden-files: true
          retention-days: 30

  visueel:
    name: "Gate 5 · Visueel (waarschuwing)"
    runs-on: ubuntu-latest
    timeout-minutes: 35  # browserinstallatie max. 18 min (2 × 8) + schermvergelijking
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci || npm install
      # Browsers uit de cache (sleutel: besturingssysteem + Playwright-versie uit node_modules, niet hard
      # in de workflow). Systeempakketten staan niet in de cache: bij een treffer alleen install-deps.
      - name: Playwright-versie bepalen
        id: pw
        run: echo "versie=$(npx playwright --version | awk '{print $2}')" >> "$GITHUB_OUTPUT"
      - name: Browsers uit de cache halen
        id: pw-cache
        uses: actions/cache/restore@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.pw.outputs.versie }}-chromium-webkit
      - name: Browsers installeren (Chromium en WebKit)
        id: browsers
        # niet blokkerend: lukt de installatie ook na de herkansing niet, dan mislukt de run niet
        continue-on-error: true
        # twee pogingen van hooguit 8 minuten (besluit 7 nov.); hangt de eerste, dan stopt timeout hem
        timeout-minutes: 18
        env:
          CACHE_HIT: ${{ steps.pw-cache.outputs.cache-hit }}
        run: |
          if [ "$CACHE_HIT" = "true" ]; then
            echo "Browsers uit de cache; alleen systeempakketten installeren."
            installeer() { npx playwright install-deps chromium webkit; }
          else
            installeer() { npx playwright install --with-deps chromium webkit; }
          fi
          export -f installeer
          timeout -k 30 480 bash -c installeer || {
            echo "::warning::Browserinstallatie mislukt of duurde langer dan 8 minuten; tweede en laatste poging."
            timeout -k 30 480 bash -c installeer
          }
      - name: Browsers in de cache bewaren
        if: steps.pw-cache.outputs.cache-hit != 'true' && steps.browsers.outcome == 'success'
        uses: actions/cache/save@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.pw.outputs.versie }}-chromium-webkit
      - name: Schermen vergelijken met de goedgekeurde basis
        id: vergelijk
        continue-on-error: true   # niet blokkerend: verschillen gaan naar het validatierapport
        run: VISUEEL=1 npx playwright test
      - name: Melding bij verschil
        if: steps.vergelijk.outcome == 'failure'
        run: echo "::warning::Schermen wijken af van de basis (of er is nog geen basis). Bekijk het artefact 'visueel' en het validatierapport."
      - name: Resultaten bewaren
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: visueel
          path: |
            rapport/visueel.json
            rapport/visueel-html/
            rapport/playwright-resultaten/
          retention-days: 30

  validatierapport:
    name: "Validatierapport (GO / NO-GO)"
    needs: [tests, sitecontrole, kwaliteit, visueel]
    if: always() && github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/download-artifact@v4
        with:
          name: kwaliteit
          path: .
        continue-on-error: true
      - uses: actions/download-artifact@v4
        with:
          name: visueel
          path: rapport-visueel
        continue-on-error: true
      - name: Rapport maken
        env:
          GATE1: ${{ needs.tests.result }}
          GATE2: ${{ needs.sitecontrole.result }}
          GATE4: ${{ needs.kwaliteit.result }}
          GATE5: ${{ needs.visueel.result }}
          PR_NUMMER: ${{ github.event.pull_request.number }}
          PR_TITEL: ${{ github.event.pull_request.title }}
          BRANCH: ${{ github.head_ref }}
          BASE_REF: ${{ github.base_ref }}
          SHA: ${{ github.event.pull_request.head.sha }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          PREVIEW_DOMEIN: ${{ vars.PREVIEW_DOMEIN || 'luxmini.carstvdbosch.workers.dev' }}
        run: |
          if [ -f rapport-visueel/visueel.json ]; then cp rapport-visueel/visueel.json rapport/visueel.json; fi
          # Cloudflare Workers Builds: preview per branch op <branch>-<worker>.<subdomein>.workers.dev
          alias=$(echo "$BRANCH" | tr '[:upper:]' '[:lower:]' | sed -E 's/[^a-z0-9]+/-/g; s/^-+|-+$//g')
          export PREVIEW_URL="https://${alias}-${PREVIEW_DOMEIN}"
          node scripts/validatierapport.mjs > /dev/null
          cat rapport/validatierapport.md >> "$GITHUB_STEP_SUMMARY"
      - name: Rapport in de pull request zetten (of bijwerken)
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          { echo '<!-- validatierapport -->'; cat rapport/validatierapport.md; } > reactie.md
          id=$(gh api "repos/${{ github.repository }}/issues/$PR/comments" --paginate --jq '.[] | select(.body | startswith("<!-- validatierapport -->")) | .id' | tail -1)
          if [ -n "$id" ]; then gh api -X PATCH "repos/${{ github.repository }}/issues/comments/$id" -F body=@reactie.md > /dev/null
          else gh api -X POST "repos/${{ github.repository }}/issues/$PR/comments" -F body=@reactie.md > /dev/null; fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: validatierapport
          path: |
            rapport/validatierapport.md
            rapport/validatierapport.html
          retention-days: 90
